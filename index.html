<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리학교 오늘 뭐 먹지? | 급식 알리미</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts (Pretendard-like Inter + Noto Sans KR) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(180deg, #EFF6FF 0%, #F8FAFC 100%);
      min-height: 100vh;
    }
    /* 커스텀 스크롤바 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #F1F5F9;
    }
    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94A3B8;
    }
  </style>
</head>
<body class="text-slate-800 antialiased selection:bg-blue-200">
  <!-- 상단 네비게이션 헤더 -->
  <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-blue-100 shadow-sm transition-all">
    <div class="max-w-xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-md shadow-blue-500/20">
          <i data-lucide="utensils" class="w-5 h-5"></i>
        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <span class="text-xs font-bold px-2 py-0.5 rounded-full bg-blue-100 text-blue-700">푸른고등학교</span>
            <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
          </div>
          <h1 class="text-base font-bold text-slate-900 leading-tight">오늘의 급식표</h1>
        </div>
      </div>
      <!-- 알레르기 가이드 팝업 버튼 -->
      <button onclick="toggleAllergyModal(true)" 
              class="flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-semibold bg-blue-50 hover:bg-blue-100 text-blue-700 transition active:scale-95 border border-blue-200"
              title="알레르기 번호 안내">
        <i data-lucide="shield-alert" class="w-4 h-4 text-blue-600"></i>
        <span class="hidden sm:inline">알레르기 정보표</span>
        <span class="sm:hidden">알레르기</span>
      </button>
    </div>
  </header>

  <!-- 메인 컨테이너 -->
  <main class="max-w-xl mx-auto px-4 py-6 pb-20">

    <!-- 날짜 선택 바 & 빠른 이동 탭 -->
    <section class="bg-white rounded-2xl p-4 sm:p-5 shadow-sm border border-blue-100/80 mb-5">
      <div class="flex flex-col gap-3">
        <!-- 날짜 인풋 -->
        <div class="flex items-center justify-between gap-3">
          <label for="date-input" class="text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center gap-1.5">
            <i data-lucide="calendar" class="w-4 h-4 text-blue-600"></i>
            날짜 선택
          </label>
          <div class="relative flex-1 max-w-[210px]">
            <input 
              type="date" 
              id="date-input" 
              class="w-full text-sm font-semibold bg-blue-50/60 border border-blue-200 text-blue-900 rounded-xl px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition cursor-pointer"
            >
          </div>
        </div>

        <!-- 5일치 빠른 이동 탭 버튼들 -->
        <div class="pt-2 border-t border-slate-100">
          <p class="text-[11px] text-slate-400 font-medium mb-2">이번 주 급식 바로가기</p>
          <div id="quick-date-chips" class="grid grid-cols-5 gap-1.5 text-center">
            <!-- JS로 동적 생성 -->
          </div>
        </div>
      </div>
    </section>

    <!-- 현재 날짜 타이틀 헤더 -->
    <div class="flex items-center justify-between mb-3 px-1">
      <div>
        <h2 id="current-date-text" class="text-lg font-bold text-slate-800 tracking-tight"></h2>
        <p id="calorie-text" class="text-xs text-blue-600 font-medium mt-0.5"></p>
      </div>
      <button onclick="shareMealInfo()" class="p-2 rounded-xl text-slate-500 hover:text-blue-600 hover:bg-white bg-slate-100/80 transition active:scale-95" title="식단 복사하기">
        <i data-lucide="share-2" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- 식단 목록 카드 컨테이너 -->
    <div id="meal-card-container" class="space-y-4">
      <!-- 급식 데이터가 동적으로 렌더링됩니다 -->
    </div>

    <!-- 오늘 식단 평가/응원 미니 뱃지 -->
    <section class="mt-6 p-4 rounded-2xl bg-blue-600 text-white flex items-center justify-between shadow-lg shadow-blue-500/15">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-white/20 flex items-center justify-center text-white text-xl">
          🍱
        </div>
        <div>
          <h3 class="text-sm font-bold">식사 맛있게 하세요!</h3>
          <p class="text-xs text-blue-100">균형 잡힌 식단으로 활기찬 하루 보내기</p>
        </div>
      </div>
      <button onclick="alertGoodJob()" class="px-3 py-1.5 bg-white text-blue-700 text-xs font-bold rounded-lg hover:bg-blue-50 transition active:scale-95">
        잘먹겠습니다!
      </button>
    </section>
  </main>

  <!-- 알레르기 안내 모달 다이얼로그 -->
  <div id="allergy-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm hidden opacity-0 transition-opacity duration-200">
    <div class="bg-white rounded-3xl max-w-md w-full max-h-[85vh] flex flex-col shadow-2xl border border-slate-100 overflow-hidden transform scale-95 transition-transform duration-200" id="modal-box">
      <!-- 모달 상단 -->
      <div class="p-5 border-b border-slate-100 flex items-center justify-between bg-blue-50/50">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-lg bg-blue-600 text-white flex items-center justify-center">
            <i data-lucide="info" class="w-4 h-4"></i>
          </div>
          <div>
            <h3 class="text-base font-bold text-slate-800">식품 알레르기 유발물질 번호표</h3>
            <p class="text-[11px] text-slate-500">교육부 학교급식 위생관리지침 기준 (19종)</p>
          </div>
        </div>
        <button onclick="toggleAllergyModal(false)" class="text-slate-400 hover:text-slate-700 p-1.5 rounded-lg hover:bg-slate-100">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- 모달 본문 (알레르기 번호 매핑 리스트) -->
      <div class="p-5 overflow-y-auto space-y-2 text-xs" id="allergy-legend-list">
        <!-- JS로 1~19번 렌더링 -->
      </div>

      <!-- 모달 하단 -->
      <div class="p-4 border-t border-slate-100 bg-slate-50 text-right">
        <button onclick="toggleAllergyModal(false)" class="w-full sm:w-auto px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-medium text-xs shadow-md shadow-blue-500/20 active:scale-95 transition">
          확인하고 닫기
        </button>
      </div>
    </div>
  </div>

  <!-- 간단한 복사/안내 토스트 메시지 -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900/90 text-white text-xs px-4 py-2.5 rounded-full shadow-lg pointer-events-none opacity-0 transition-opacity duration-300 z-50 flex items-center gap-2">
    <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400"></i>
    <span id="toast-message">메시지 내용</span>
  </div>

  <script>
    /* =========================================================
       1. 알레르기 유발 정보 데이터 (교육부 학교급식 19종 표준)
       ========================================================= */
    const ALLERGY_INFO = {
      1: { name: '난류(달걀)', icon: '🥚', badgeColor: 'bg-amber-100 text-amber-800 border-amber-200' },
      2: { name: '우유', icon: '🥛', badgeColor: 'bg-sky-100 text-sky-800 border-sky-200' },
      3: { name: '메밀', icon: '🌾', badgeColor: 'bg-stone-100 text-stone-800 border-stone-200' },
      4: { name: '땅콩', icon: '🥜', badgeColor: 'bg-yellow-100 text-yellow-800 border-yellow-200' },
      5: { name: '대두(콩)', icon: '🌱', badgeColor: 'bg-emerald-100 text-emerald-800 border-emerald-200' },
      6: { name: '밀', icon: '🍞', badgeColor: 'bg-orange-100 text-orange-800 border-orange-200' },
      7: { name: '고등어', icon: '🐟', badgeColor: 'bg-blue-100 text-blue-800 border-blue-200' },
      8: { name: '게', icon: '🦀', badgeColor: 'bg-red-100 text-red-800 border-red-200' },
      9: { name: '새우', icon: '🦐', badgeColor: 'bg-rose-100 text-rose-800 border-rose-200' },
      10: { name: '돼지고기', icon: '🥓', badgeColor: 'bg-pink-100 text-pink-800 border-pink-200' },
      11: { name: '복숭아', icon: '🍑', badgeColor: 'bg-pink-100 text-pink-800 border-pink-200' },
      12: { name: '토마토', icon: '🍅', badgeColor: 'bg-red-100 text-red-800 border-red-200' },
      13: { name: '아황산염', icon: '🧪', badgeColor: 'bg-purple-100 text-purple-800 border-purple-200' },
      14: { name: '호두', icon: '🌰', badgeColor: 'bg-amber-100 text-amber-800 border-amber-200' },
      15: { name: '닭고기', icon: '🍗', badgeColor: 'bg-yellow-100 text-yellow-800 border-yellow-200' },
      16: { name: '쇠고기', icon: '🥩', badgeColor: 'bg-red-100 text-red-800 border-red-200' },
      17: { name: '오징어', icon: '🦑', badgeColor: 'bg-cyan-100 text-cyan-800 border-cyan-200' },
      18: { name: '조개류(굴/전복/홍합)', icon: '🦪', badgeColor: 'bg-teal-100 text-teal-800 border-teal-200' },
      19: { name: '잣', icon: '🌲', badgeColor: 'bg-emerald-100 text-emerald-800 border-emerald-200' }
    };

    /* =========================================================
       2. 5일치 샘플 급식 데이터 (중식 기준)
       ========================================================= */
    const MEAL_DATABASE = {
      "2026-11-02": {
        dateStr: "2026-11-02",
        dayName: "월요일",
        calorie: "842 kcal",
        origin: "쌀: 국내산, 쇠고기: 국내산 한우, 돼지고기: 국내산, 김치: 국내산",
        items: [
          { name: "친환경 찰흑미밥", allergies: [] },
          { name: "얼큰 소고기 미역국", allergies: [5, 6, 16] },
          { name: "치즈 등갈비 꿀강정", allergies: [1, 2, 5, 6, 10, 12, 13] },
          { name: "새콤달콤 도토리묵무침", allergies: [5, 6, 13] },
          { name: "아삭 깍두기", allergies: [9] },
          { name: "수제 망고 에이드", allergies: [] }
        ]
      },
      "2026-11-03": {
        dateStr: "2026-11-03",
        dayName: "화요일",
        calorie: "895 kcal",
        origin: "쌀: 국내산, 닭고기: 국내산, 김치: 국내산",
        items: [
          { name: "단호박 카레라이스", allergies: [2, 5, 6, 10, 12, 16] },
          { name: "유부 맑은 팽이버섯 장국", allergies: [5, 6] },
          { name: "바삭 크리스피 왕닭꼬치", allergies: [1, 5, 6, 15] },
          { name: "파프리카 수제 오이피클", allergies: [13] },
          { name: "배추김치", allergies: [9] },
          { name: "초코 퐁당 쁘띠슈", allergies: [1, 2, 5, 6] }
        ]
      },
      "2026-11-04": {
        dateStr: "2026-11-04",
        dayName: "수요일",
        calorie: "910 kcal",
        origin: "쌀: 국내산, 닭고기: 국내산, 오징어: 국내산, 김치: 국내산",
        items: [
          { name: "클래식 함박스테이크 덮밥", allergies: [1, 2, 5, 6, 10, 12, 16] },
          { name: "구수한 미소장국", allergies: [5, 6] },
          { name: "매콤 해물 오징어 떡볶이", allergies: [5, 6, 17] },
          { name: "참깨 드레싱 그린 샐러드", allergies: [1, 5] },
          { name: "깍두기", allergies: [9] },
          { name: "짜먹는 딸기 요거트", allergies: [2] }
        ]
      },
      "2026-11-05": {
        dateStr: "2026-11-05",
        dayName: "목요일",
        calorie: "790 kcal",
        origin: "쌀: 국내산, 돼지고기: 국내산, 꽃게: 국내산, 김치: 국내산",
        items: [
          { name: "차조밥", allergies: [] },
          { name: "시원한 꽃게 된장찌개", allergies: [5, 6, 8, 18] },
          { name: "직화 돼지 간장 불고기 & 쌈채소", allergies: [5, 6, 10, 13] },
          { name: "노릇 감자 채전", allergies: [5, 6] },
          { name: "알타리 김치", allergies: [9] },
          { name: "달콤 황도 젤리", allergies: [11] }
        ]
      },
      "2026-11-06": {
        dateStr: "2026-11-06",
        dayName: "금요일",
        calorie: "935 kcal",
        origin: "새우: 베트남산, 돼지고기: 국내산, 김치: 국내산",
        items: [
          { name: "불맛 마라 볶음 쌀국수", allergies: [4, 5, 6, 9, 10, 13, 17, 18] },
          { name: "달걀 실파 계란국", allergies: [1, 5, 6] },
          { name: "탱글 통새우 멘보샤 & 칠리소스", allergies: [1, 5, 6, 9] },
          { name: "짜사이 단무지 무침", allergies: [13] },
          { name: "포기김치", allergies: [9] },
          { name: "유기농 착즙 사과주스", allergies: [13] }
        ]
      }
    };

    // 사용 가능한 기본 5일 날짜 목록
    const AVAILABLE_DATES = Object.keys(MEAL_DATABASE).sort();
    let selectedDate = AVAILABLE_DATES[0]; // 시작 날짜 (월요일)

    /* =========================================================
       3. 렌더링 로직
       ========================================================= */

    // 요일 칩(Chip) 탭 렌더링
    function renderQuickChips() {
      const container = document.getElementById('quick-date-chips');
      container.innerHTML = '';

      AVAILABLE_DATES.forEach(date => {
        const meal = MEAL_DATABASE[date];
        const isSelected = (date === selectedDate);
        const dayShort = meal.dayName.charAt(0);
        const dayNum = date.split('-')[2];

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.onclick = () => selectDate(date);
        btn.className = `flex flex-col items-center justify-center py-2 px-1 rounded-xl transition duration-150 border active:scale-95 ${
          isSelected 
            ? 'bg-blue-600 text-white font-bold border-blue-600 shadow-md shadow-blue-500/25' 
            : 'bg-white hover:bg-blue-50 text-slate-700 border-slate-200 font-medium'
        }`;

        btn.innerHTML = `
          <span class="text-[10px] ${isSelected ? 'text-blue-100' : 'text-slate-400'}">${dayShort}</span>
          <span class="text-sm font-bold mt-0.5">${dayNum}일</span>
        `;
        container.appendChild(btn);
      });
    }

    // 선택된 날짜 식단 상세 렌더링
    function renderMealDetail() {
      const dateInput = document.getElementById('date-input');
      dateInput.value = selectedDate;

      const meal = MEAL_DATABASE[selectedDate];
      const dateTextEl = document.getElementById('current-date-text');
      const calorieTextEl = document.getElementById('calorie-text');
      const container = document.getElementById('meal-card-container');

      if (!meal) {
        // 급식 없는 날 (주말/휴일 등)
        const d = new Date(selectedDate);
        const days = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
        const dayName = isNaN(d.getDay()) ? '' : `(${days[d.getDay()]})`;

        dateTextEl.textContent = `${selectedDate} ${dayName}`;
        calorieTextEl.textContent = "급식 정보가 없습니다.";

        container.innerHTML = `
          <div class="bg-white rounded-2xl p-8 text-center border border-dashed border-slate-200">
            <div class="w-14 h-14 bg-blue-50 text-blue-500 rounded-full flex items-center justify-center mx-auto mb-3">
              <i data-lucide="coffee" class="w-6 h-6"></i>
            </div>
            <h4 class="text-base font-bold text-slate-700">해당 날짜에는 급식이 없습니다</h4>
            <p class="text-xs text-slate-400 mt-1">주말, 공휴일이거나 아직 식단이 등록되지 않았어요.<br>위 탭에서 11월 2일 ~ 11월 6일 식단을 둘러보세요!</p>
            <button onclick="selectDate('${AVAILABLE_DATES[0]}')" class="mt-4 px-4 py-2 bg-blue-600 text-white text-xs font-semibold rounded-xl hover:bg-blue-700 transition">
              이번 주 식단 보러가기
            </button>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      // 식단 있는 날
      dateTextEl.innerHTML = `${meal.dateStr} <span class="text-blue-600 font-bold ml-1">${meal.dayName}</span>`;
      calorieTextEl.innerHTML = `총 열량: <strong>${meal.calorie}</strong> · 표준 급식량 기준`;

      // 메뉴 카드 생성
      let cardsHtml = `
        <div class="bg-white rounded-2xl shadow-sm border border-blue-100 overflow-hidden divide-y divide-slate-100">
          <div class="px-5 py-3.5 bg-blue-50/70 flex items-center justify-between">
            <div class="flex items-center gap-2">
              <span class="inline-block w-2.5 h-2.5 rounded-full bg-blue-500"></span>
              <span class="text-xs font-bold text-blue-900 uppercase">중식 메뉴 리스트 (${meal.items.length}종)</span>
            </div>
            <span class="text-[11px] font-semibold text-blue-600 bg-white px-2 py-0.5 rounded-full border border-blue-200/60">영양만점 식단</span>
          </div>
      `;

      meal.items.forEach((item, index) => {
        // 알레르기 태그 생성
        let allergyBadges = '';
        if (item.allergies && item.allergies.length > 0) {
          allergyBadges = item.allergies.map(num => {
            const info = ALLERGY_INFO[num];
            if (!info) return '';
            return `
              <span class="inline-flex items-center gap-0.5 px-2 py-0.5 rounded-md text-[10px] font-bold border ${info.badgeColor} transition hover:scale-105" title="${num}번: ${info.name}">
                <span class="text-xs">${info.icon}</span>
                <span>${num}</span>
                <span class="font-normal opacity-75 sm:inline hidden">${info.name}</span>
              </span>
            `;
          }).join('');
        } else {
          allergyBadges = `<span class="text-[11px] text-emerald-600 font-medium flex items-center gap-1"><i data-lucide="check" class="w-3.5 h-3.5"></i>알레르기 프리</span>`;
        }

        cardsHtml += `
          <div class="p-4 sm:px-5 flex flex-col sm:flex-row sm:items-center justify-between gap-2.5 hover:bg-blue-50/20 transition">
            <div class="flex items-center gap-3">
              <span class="w-6 h-6 rounded-full bg-blue-100 text-blue-700 text-xs font-bold flex items-center justify-center shrink-0">
                ${index + 1}
              </span>
              <span class="text-sm sm:text-base font-semibold text-slate-800">${item.name}</span>
            </div>
            <div class="flex flex-wrap items-center gap-1.5 pl-9 sm:pl-0">
              ${allergyBadges}
            </div>
          </div>
        `;
      });

      cardsHtml += `</div>`;

      // 원산지 정보 섹션
      if (meal.origin) {
        cardsHtml += `
          <div class="bg-slate-50/80 rounded-xl p-3.5 text-xs text-slate-500 border border-slate-200/80 flex items-start gap-2">
            <i data-lucide="info" class="w-4 h-4 text-slate-400 shrink-0 mt-0.5"></i>
            <div>
              <strong class="text-slate-700 font-medium">원산지 안내:</strong> ${meal.origin}
            </div>
          </div>
        `;
      }

      container.innerHTML = cardsHtml;
      lucide.createIcons();
    }

    // 날짜 선택 이벤트
    function selectDate(date) {
      selectedDate = date;
      renderQuickChips();
      renderMealDetail();
    }

    // 알레르기 모달 토글
    function toggleAllergyModal(show) {
      const modal = document.getElementById('allergy-modal');
      const box = document.getElementById('modal-box');
      if (show) {
        modal.classList.remove('hidden');
        setTimeout(() => {
          modal.classList.remove('opacity-0');
          box.classList.remove('scale-95');
          box.classList.add('scale-100');
        }, 10);
      } else {
        modal.classList.add('opacity-0');
        box.classList.remove('scale-100');
        box.classList.add('scale-95');
        setTimeout(() => {
          modal.classList.add('hidden');
        }, 200);
      }
    }

    // 알레르기 범례 리스트 렌더링
    function initAllergyLegend() {
      const list = document.getElementById('allergy-legend-list');
      let html = '<div class="grid grid-cols-1 sm:grid-cols-2 gap-2">';
      Object.keys(ALLERGY_INFO).forEach(num => {
        const item = ALLERGY_INFO[num];
        html += `
          <div class="flex items-center gap-2.5 p-2 rounded-xl bg-slate-50 border border-slate-100">
            <span class="w-7 h-7 rounded-lg bg-white shadow-xs border border-slate-200 flex items-center justify-center text-sm font-bold text-blue-600">
              ${num}
            </span>
            <span class="text-lg">${item.icon}</span>
            <span class="font-semibold text-slate-700 text-xs">${item.name}</span>
          </div>
        `;
      });
      html += '</div>';
      list.innerHTML = html;
    }

    // 토스트 팝업 띄우기
    function showToast(msg) {
      const toast = document.getElementById('toast');
      const msgEl = document.getElementById('toast-message');
      msgEl.textContent = msg;
      toast.classList.remove('opacity-0');
      setTimeout(() => {
        toast.classList.add('opacity-0');
      }, 2200);
    }

    // 식단 복사 공유
    function shareMealInfo() {
      const meal = MEAL_DATABASE[selectedDate];
      if (!meal) {
        showToast('공유할 급식 정보가 없습니다.');
        return;
      }
      const menuList = meal.items.map(it => `- ${it.name}`).join('\n');
      const textToCopy = `[푸른고등학교 ${meal.dateStr} (${meal.dayName}) 급식]\n${menuList}\n칼로리: ${meal.calorie}`;

      // 클립보드 복사 (안전한 textarea 대체 방식)
      const tempTextArea = document.createElement('textarea');
      tempTextArea.value = textToCopy;
      document.body.appendChild(tempTextArea);
      tempTextArea.select();
      document.execCommand('copy');
      document.body.removeChild(tempTextArea);

      showToast('오늘의 식단이 클립보드에 복사되었어요!');
    }

    // 귀여운 인터랙션
    function alertGoodJob() {
      showToast('맛있게 드시고 힘찬 하루 보내세요! 화이팅 ☀️');
    }

    /* =========================================================
       4. 초기화 및 이벤트 리스너
       ========================================================= */
    window.addEventListener('DOMContentLoaded', () => {
      // 오늘 날짜가 샘플 범위 내에 있으면 오늘 날짜로 세팅, 없으면 첫번째 날짜 세팅
      const today = new Date().toISOString().split('T')[0];
      if (MEAL_DATABASE[today]) {
        selectedDate = today;
      }

      // 날짜 피커 변경 이벤트
      document.getElementById('date-input').addEventListener('change', (e) => {
        selectDate(e.target.value);
      });

      // 바깥 영역 클릭시 모달 닫기
      document.getElementById('allergy-modal').addEventListener('click', (e) => {
        if (e.target.id === 'allergy-modal') {
          toggleAllergyModal(false);
        }
      });

      initAllergyLegend();
      renderQuickChips();
      renderMealDetail();
      lucide.createIcons();
    });
  </script>
</body>
</html>
